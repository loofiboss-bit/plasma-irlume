name: Fedora 44 RPM

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install RPM build dependencies
        run: |
          dnf install -y \
            clang-tools-extra \
            cmake \
            cmake-rpm-macros \
            desktop-file-utils \
            extra-cmake-modules \
            gcc-c++ \
            kf6-kcmutils-devel \
            kf6-kcoreaddons-devel \
            kf6-ki18n-devel \
            kf6-kirigami-devel \
            ninja-build \
            python3-jsonschema \
            python3 \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtmultimedia-devel \
            rpm-build \
            rpmlint \
            systemd-devel

      - name: Build source archive
        run: packaging/fedora/create-source-archive.sh

      - name: Build and lint RPM
        run: |
          rpmbuild -ba packaging/fedora/plasma-irlume.spec \
            --define "_sourcedir $PWD"
          rpmlint packaging/fedora/plasma-irlume.spec \
            "$HOME"/rpmbuild/RPMS/*/plasma-irlume-*.rpm \
            "$HOME"/rpmbuild/SRPMS/plasma-irlume-*.src.rpm

      - name: Test install and uninstall lifecycle
        run: |
          packaging/fedora/rpm-smoke-test.sh \
            "$(find "$HOME/rpmbuild/RPMS" -type f -name 'plasma-irlume-[0-9]*.rpm' -print -quit)"

      - name: Collect RPM artifacts
        run: |
          mkdir -p artifacts
          cp "$HOME"/rpmbuild/RPMS/*/plasma-irlume-*.rpm artifacts/
          cp "$HOME"/rpmbuild/SRPMS/plasma-irlume-*.src.rpm artifacts/
          (cd artifacts && sha256sum ./*.rpm >SHA256SUMS)

      - name: Upload RPM artifacts to Workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plasma-irlume-fedora-44
          path: artifacts/
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          if [ -n "$TAG_NAME" ] && gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" artifacts/* --clobber
          fi
